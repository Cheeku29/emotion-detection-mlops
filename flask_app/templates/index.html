<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #202938;
        }

        .container {
            width: 100%;
            max-width: 620px;
            padding: 32px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 28px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            resize: vertical;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            background: #eef2ff;
        }

        .error {
            color: #b42318;
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Emotion Detection</h1>
        <p class="subtitle">
            Enter a message to predict whether it expresses happiness or sadness.
        </p>

        <form action="/predict" method="POST">
            <label for="text">Your text</label><br><br>

            <textarea id="text" name="text" placeholder="Type something here..." required>{{ text }}</textarea>

            <button type="submit">Analyze Emotion</button>
        </form>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        {% if result %}
        <div class="result" role="status">
            <h2>Prediction: {{ result }}</h2>
        </div>
        {% endif %}
    </main>
</body>

</html>
