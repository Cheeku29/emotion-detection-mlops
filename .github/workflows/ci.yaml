name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup uv
        uses: astral-sh/setup-uv@v5

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: download NLTK resources
        run: |
          python -m nltk.downloader stopwords wordnet omw-1.4

      - name: build and evaluate model
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          dvc repro model_evaluation

      - name: test model
        run: |
          python -m pytest tests/test_model.py -q

      - name: promote tested model to production
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          dvc repro model_registration

      - name: test Flask app
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          python -m pytest tests/test_flask_app.py -q

      - name: Login to AWS ECR
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set default.region ap-southeast-2
          aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 222238779214.dkr.ecr.ap-southeast-2.amazonaws.com

      - name: Build Docker image
        run: |
          docker build --provenance=false --sbom=false -t arindam7084_ecr .

      - name: Tag Docker image
        run: |
          docker tag arindam7084_ecr:latest 222238779214.dkr.ecr.ap-southeast-2.amazonaws.com/arindam7084_ecr:latest

      - name: Push Docker image to AWS ECR
        run: |
          docker push 222238779214.dkr.ecr.ap-southeast-2.amazonaws.com/arindam7084_ecr:latest
