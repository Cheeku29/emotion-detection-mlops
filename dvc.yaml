stages:
  data_ingestion:
    cmd: uv run python -m src.data.data_ingestion
    deps:
      - src/data/data_ingestion.py
      - params.yaml
    params:
      - data_ingestion
    outs:
      - data/raw

  data_preprocessing:
    cmd: uv run python -m src.data.data_preprocessing
    deps:
      - src/data/data_preprocessing.py
      - data/raw
      - params.yaml
    params:
      - data_preprocessing
    outs:
      - data/interim

  feature_engineering:
    cmd: uv run python -m src.features.feature_engineering
    deps:
      - src/features/feature_engineering.py
      - data/interim
      - params.yaml
    params:
      - feature_engineering
    outs:
      - data/processed
      - models/vectorizer.pkl

  model_building:
    cmd: uv run python -m src.models.model_building
    deps:
      - src/models/model_building.py
      - data/processed/train_bow.csv
      - params.yaml
    params:
      - model_building
    outs:
      - models/model.pkl

  model_evaluation:
    cmd: uv run python -m src.models.model_evaluation
    deps:
      - src/models/model_evaluation.py
      - models/model.pkl
      - data/processed/test_bow.csv
      - params.yaml
    params:
      - model_evaluation
    metrics:
      - reports/metrics.json

  model_registration:
    cmd: uv run python -m src.models.model_registration
    deps:
      - src/models/model_registration.py
      - reports/experiment_info.json
      - reports/metrics.json
