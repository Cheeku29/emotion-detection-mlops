stages:
  data_ingestion:
    cmd: uv run python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
      - params.yaml
    params:
      - data_ingestion
    outs:
      - data/raw

  data_preprocessing:
    cmd: uv run python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - data/raw
      - params.yaml
    params:
      - data_preprocessing
    outs:
      - data/interim

  feature_engineering:
    cmd: uv run python src/features/feature_engineering.py
    deps:
      - src/features/feature_engineering.py
      - data/interim
      - params.yaml
    params:
      - feature_engineering
    outs:
      - data/processed

  model_building:
    cmd: uv run python src/models/model_building.py
    deps:
      - src/models/model_building.py
      - data/processed/train_bow.csv
      - params.yaml
    params:
      - model_building
    outs:
      - models/model.pkl

  model_evaluation:
    cmd: uv run python src/models/model_evaluation.py
    deps:
      - src/models/model_evaluation.py
      - models/model.pkl
      - data/processed/test_bow.csv
      - params.yaml
    params:
      - model_evaluation
    metrics:
      - reports/metrics.json
